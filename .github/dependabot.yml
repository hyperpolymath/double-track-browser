version: 2
updates:
  # The Rust crate lives under rust_core/, not the repo root. With
  # directory: "/" Dependabot aborted every run with "/Cargo.toml not
  # found" (runs 33629413711 on 2026-09-02 and 33389729963 on 08-31).
  - package-ecosystem: "cargo"
    directory: "/rust_core"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub\'s
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
# `npm` is deliberately absent: the repository has no package.json at any
# path (checked 2026-09-02), so the entry only produced
# "/package.json not found" failures on every Dependabot run.
# `github-actions` is deliberately absent: Dependabot bumps `uses:` pins
# without regenerating .github/workflows/actions.lock, which put every
# workflow using the bumped action into startup_failure ("Invalid
# lockfile") — #92 did exactly that to CodeQL on 2026-09-02. Action pin
# bumps come from the standards lock-refresh workflow, which regenerates
# the lock in the same PR (standards spec 2026-09-02-cicd-regularisation
# §6.4). `guix` was removed because it is not a Dependabot ecosystem.
